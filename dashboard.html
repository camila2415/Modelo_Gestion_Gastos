<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Panel de Gastos</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <header class="navbar">
        <span id="userEmailDisplay" class="link">usuario@correo.com</span>
        <div class="user-controls">
            <button id="btnTema" class="btn-theme">Modo Día / Noche</button>
            <button id="btnLogout" class="btn-delete">Cerrar Sesión</button>
        </div>
    </header>

    <h1 class="titulo-principal">Sistema de Gestión de Gastos</h1>

    <main class="dashboard-container">
        
        <section class="summary-card">
            <h3>Monto Total Gastado</h3>
            <div class="monto-total">$<span id="totalGastado">0.00</span></div>
        </section>

        <section class="form-card">
            <h3>Agregar / Editar Gasto</h3>
            <form id="formGasto">
                <input type="hidden" id="gastoId">

                <div class="form-group">
                    <label for="monto">Monto ($)</label>
                    <input type="number" id="monto" placeholder="Ej: 1500" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoría</label>
                    <select id="categoria" required>
                        <option value="" disabled selected>Seleccioná una categoría</option>
                        <option value="Comida">🍔 Comida / Supermercado</option>
                        <option value="Transporte">🚌 Transporte / Nafta</option>
                        <option value="Servicios">💡 Servicios (Luz, Agua, Gas, Internet)</option>
                        <option value="Entretenimiento">🎬 Entretenimiento / Salidas</option>
                        <option value="Salud">💊 Salud / Farmacia</option>
                        <option value="Ropa">👕 Ropa / Calzado</option>
                        <option value="Alquiler">🏠 Alquiler</option>
                        <option value="Varios">📌 Varios</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="fecha">Fecha</label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="form-group">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" placeholder="Ej: Compra mensual del súper" required>
                </div>

                <button type="submit" id="btnGuardar" class="btn-primary">Guardar Gasto</button>
            </form>
        </section>

        <section class="table-card">
            <h3>Historial de Gastos</h3>
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Categoría</th>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaGastosBody">
                </tbody>
            </table>
        </section>

    </main>
    <div id="modalConfirmar" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>¿Confirmar eliminación?</h3>
            <p>¿Está seguro de que desea eliminar este registro de gasto?</p>
            <div class="modal-buttons">
                <button id="btnAceptarEliminar" class="btn-danger">Aceptar</button>
                <button id="btnCancelarEliminar" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="js/gastos.js"></script>
</body>
</html>
