<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Ingreso al Grand Line 🏴‍☠️</title>
    <!-- Favicon de Sombrero de Paja -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="one-piece-theme auth-page">

    <div class="header-tools">
        <button id="btnTema" class="btn-theme">☀️ Modo Sol / Noche 🌙</button>
    </div>

    <div class="brand-header" style="text-align: center; margin-bottom: 20px;">
        <img src="assets/img/logo-jolly-roger.png" alt="Jolly Roger" class="auth-logo" onerror="this.style.display='none'">
        <h1 class="titulo-principal" style="text-align: center; margin-bottom: 5px;">🏴‍☠️ Tesorería del Grand Line</h1>
        <p class="subtitulo-pirata" style="text-align: center; margin: 0 auto; display: block;">Control de Botín y Gastos de la Tripulación</p>
    </div>

    <main class="login-card">
        <h2>⚓ Identificación de Pirata</h2>
        
        <form id="formLogin">
            <div class="form-group">
                <label for="email">Correo Electrónico del Capitán / Navegante</label>
                <input type="email" id="email" placeholder="luffy@strawhats.com" required>
            </div>

            <div class="form-group">
                <label for="password">Clave del Cofre del Tesoro</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <button type="button" id="verPasswordLogin" class="btn-eye">👁 Mostrar contraseña</button>
            </div>

            <button type="submit" class="btn-ingresar">⚔️ Embarcar e Ingresar</button>
        </form>

        <div class="links-container">
            <a href="registro.html" class="link">📜 Reclutamiento (Crear una cuenta)</a>
            <a href="recuperar.html" class="link">🧭 ¿Perdiste tu Vivre Card? (Recuperar clave)</a>
        </div>
    </main>

    <!-- Script de autenticación -->
    <script src="js/koo.js"></script>
</body>
</html>
