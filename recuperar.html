<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGG - Recuperar Vivre Card 🏴‍☠️</title>
    <!-- Favicon de Sombrero de Paja -->
    <link rel="icon" type="image/png" href="assets/img/favicon.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="one-piece-theme auth-page">

    <div class="header-tools">
        <button id="btnTema" class="btn-theme">☀️ Modo Sol / Noche 🌙</button>
    </div>

    <div class="brand-header" style="text-align: center; margin-bottom: 20px;">
        <img src="assets/img/logo-jolly-roger.png" alt="Jolly Roger" class="auth-logo" onerror="this.style.display='none'">
        <h1 class="titulo-principal" style="text-align: center; margin-bottom: 5px;">🏴‍☠️ Tesorería del Grand Line</h1>
        <p class="subtitulo-pirata" style="text-align: center; margin: 0 auto; display: block;">Restablece tu Acceso al Cofre del Tesoro</p>
    </div>

    <main class="login-card">
        <h2>🧭 Recuperar Vivre Card</h2>
        <p style="text-align: center; color: #555; margin-bottom: 20px; font-size: 0.95rem;">
            Ingresa tu correo registrado para enviarte las instrucciones de recuperación.
        </p>
        
        <form id="formRecuperar">
            <div class="form-group">
                <label for="emailRecuperar">Correo Electrónico Registrado</label>
                <input type="email" id="emailRecuperar" placeholder="usuario@correo.com" required>
            </div>

            <button type="submit" class="btn-ingresar">📨 Enviar Señal de Auxilio</button>
        </form>

        <div class="links-container">
            <a href="index.html" class="link">⚓ Volver a la Identificación</a>
            <a href="registro.html" class="link">📜 Reclutamiento (Crear cuenta)</a>
        </div>
    </main>

    <!-- Script de autenticación -->
    <script src="js/koo.js"></script>
</body>
</html>
